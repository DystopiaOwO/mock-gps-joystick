name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: signed-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  signed-release:
    name: Build signed release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          sdkmanager --install "platforms;android-36" "build-tools;35.0.0"

      - name: Reject tracked signing material
        run: |
          set -euo pipefail
          if git ls-files | grep -E '(^|/)keystore\.properties$|\.(jks|keystore)$'; then
            echo "signing material is tracked in git"
            exit 1
          fi

      - name: Decode release keystore
        env:
          MOCKGPS_KEYSTORE_BASE64: ${{ secrets.MOCKGPS_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import os
          import pathlib
          import sys

          raw = os.environ.get("MOCKGPS_KEYSTORE_BASE64", "")
          cleaned = "".join(raw.split())
          if not cleaned:
              sys.exit("MOCKGPS_KEYSTORE_BASE64 is not set")
          try:
              data = base64.b64decode(cleaned, validate=True)
          except Exception:
              sys.exit("MOCKGPS_KEYSTORE_BASE64 is not valid base64")
          if len(data) < 16 or data[:4] != b"\xfe\xed\xfe\xed":
              sys.exit("decoded keystore is not a JKS file")
          path = pathlib.Path(os.environ["RUNNER_TEMP"]) / "keystore" / "release.jks"
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_bytes(data)
          path.chmod(0o600)
          print(f"decoded JKS keystore ({path.stat().st_size} bytes)")
          PY

      - name: Build release APK
        env:
          MOCKGPS_KEYSTORE_FILE: ${{ runner.temp }}/keystore/release.jks
          MOCKGPS_STORE_PASSWORD: ${{ secrets.MOCKGPS_STORE_PASSWORD }}
          MOCKGPS_KEY_ALIAS: ${{ secrets.MOCKGPS_KEY_ALIAS }}
          MOCKGPS_KEY_PASSWORD: ${{ secrets.MOCKGPS_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import sys

          required = (
              "MOCKGPS_KEYSTORE_FILE",
              "MOCKGPS_STORE_PASSWORD",
              "MOCKGPS_KEY_ALIAS",
              "MOCKGPS_KEY_PASSWORD",
          )
          missing = [name for name in required if not os.environ.get(name, "").strip()]
          if missing:
              sys.exit("missing signing environment: " + ", ".join(missing))
          keystore = os.environ["MOCKGPS_KEYSTORE_FILE"]
          if not os.path.isfile(keystore):
              sys.exit("MOCKGPS_KEYSTORE_FILE does not exist")
          PY
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon --console=plain

      - name: Fail if passwords were written into the workspace
        env:
          MOCKGPS_STORE_PASSWORD: ${{ secrets.MOCKGPS_STORE_PASSWORD }}
          MOCKGPS_KEY_PASSWORD: ${{ secrets.MOCKGPS_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import pathlib
          import sys

          secrets = []
          for name in ("MOCKGPS_STORE_PASSWORD", "MOCKGPS_KEY_PASSWORD"):
              value = os.environ.get(name, "")
              if not value:
                  sys.exit(f"{name} is not set")
              secrets.append(value.encode())
          text_suffixes = {".txt", ".log", ".json", ".xml", ".html", ".htm", ".properties", ".md", ".out"}
          build_hits = []
          other_hits = []
          for path in pathlib.Path(".").rglob("*"):
              if not path.is_file() or ".git" in path.parts:
                  continue
              if path.stat().st_size > 5_000_000:
                  continue
              interesting = path.suffix.lower() in text_suffixes or "signing" in path.name.lower()
              if not interesting:
                  continue
              try:
                  data = path.read_bytes()
              except OSError:
                  continue
              if not any(secret in data for secret in secrets):
                  continue
              if "build" in path.parts:
                  build_hits.append(path)
              else:
                  other_hits.append(path.as_posix())
          if other_hits:
              print("password text was written outside the build directory:")
              print("\n".join(other_hits))
              sys.exit(1)
          for path in build_hits:
              path.unlink(missing_ok=True)
          if build_hits:
              print(f"removed {len(build_hits)} build files that contained signing passwords")
          else:
              print("workspace files do not contain signing passwords")
          PY

      - name: Verify APK signature
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          if [ ! -s "$APK" ]; then
            echo "signed release APK is missing"
            ls -l app/build/outputs/apk/release || true
            exit 1
          fi
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$SDK_ROOT" ]; then
            echo "Android SDK root is not set"
            exit 1
          fi
          APKSIGNER="$SDK_ROOT/build-tools/35.0.0/apksigner"
          if [ ! -f "$APKSIGNER" ]; then
            echo "apksigner is missing"
            exit 1
          fi
          "$APKSIGNER" verify --print-certs "$APK"

      - name: Remove decoded keystore
        if: always()
        run: |
          set -euo pipefail
          rm -f "${RUNNER_TEMP}/keystore/release.jks"
          rmdir "${RUNNER_TEMP}/keystore" 2>/dev/null || true

      - name: Name release APK
        id: apk
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            VERSION_NAME="$(sed -n 's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*"\([0-9][0-9A-Za-z.+-]*\)".*/\1/p' app/build.gradle.kts | head -n 1)"
            if [ -z "${VERSION_NAME}" ]; then
              echo "versionName not found"
              exit 1
            fi
            NAME="MockGpsJoystick-v${VERSION_NAME}.apk"
          else
            case "${GITHUB_REF_NAME}" in
              v[0-9]*) ;;
              *)
                echo "tag must look like vX.Y.Z"
                exit 1
                ;;
            esac
            NAME="MockGpsJoystick-${GITHUB_REF_NAME}.apk"
          fi
          case "${NAME}" in
            MockGpsJoystick-v*.apk) ;;
            *)
              echo "unexpected apk name"
              exit 1
              ;;
          esac
          mkdir -p dist
          cp "app/build/outputs/apk/release/app-release.apk" "dist/${NAME}"
          echo "name=${NAME}" >> "${GITHUB_OUTPUT}"
          echo "Prepared dist/${NAME}"

      - name: Upload GitHub Release
        if: github.event_name == 'push' && github.ref_type == 'tag'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          files: dist/${{ steps.apk.outputs.name }}
          fail_on_unmatched_files: true

      - name: Upload workflow artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: signed-release-apk
          path: dist/${{ steps.apk.outputs.name }}
          if-no-files-found: error
